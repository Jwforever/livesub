name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Caption tracker tests
        run: dotnet run --project scripts/caption-tracker-tests/CaptionTrackerTests.csproj -c Release

      - name: Build application
        run: dotnet build src/LiveSub/LiveSub.csproj -c Release
